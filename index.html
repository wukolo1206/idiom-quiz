<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap');

      body {
        font-family: 'Kosugi Maru', 'Microsoft JhengHei', sans-serif;
        background-color: #fdfbf7;
        text-align: center;
        margin: 0;
        padding: 10px;
        color: #555;
        overscroll-behavior: none;
      }

      .header-area {
        position: sticky;
        top: 0;
        background-color: #fdfbf7;
        z-index: 100;
        padding-bottom: 10px;
        border-bottom: 2px dashed #e0e0e0;
      }

      h1 {
        color: #ff8c42;
        font-size: 20px;
        margin: 5px 0;
      }

      .score-board {
        font-size: 16px;
        font-weight: bold;
        color: #88ccc4;
        margin-bottom: 10px;
      }

      #nav-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        max-width: 600px;
        margin: 0 auto;
      }

      .nav-btn {
        width: 35px;
        height: 35px;
        border-radius: 8px;
        border: 2px solid #ddd;
        background: #fff;
        font-size: 14px;
        font-weight: bold;
        color: #999;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .nav-btn.active {
        border-color: #ff8c42;
        transform: scale(1.1);
        box-shadow: 0 0 5px #ffcda3;
        color: #ff8c42;
      }

      .nav-btn.correct {
        background-color: #a8e6cf;
        border-color: #6bd1ac;
        color: #fff;
      }

      .nav-btn.wrong {
        background-color: #ffaaa5;
        border-color: #ff8b94;
        color: #fff;
      }

      .card {
        background: #fff;
        border-radius: 20px;
        padding: 20px;
        max-width: 500px;
        margin: 20px auto;
        box-shadow: 5px 5px 0px #e0e0e0;
        border: 2px solid #f0f0f0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 250px;
      }

      #question-text {
        font-size: 22px;
        margin-bottom: 20px;
        line-height: 1.5;
        color: #444;
      }

      .options-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .option-btn {
        background-color: #f0f4f8;
        border: 2px solid #d9e2ec;
        padding: 12px;
        border-radius: 12px;
        font-size: 18px;
        cursor: pointer;
        text-align: center;
        color: #333;
        transition: all 0.1s;
      }

      .option-btn:active {
        transform: scale(0.98);
      }

      .input-group {
        margin-bottom: 15px;
        text-align: left;
        width: 80%;
        margin-left: auto;
        margin-right: auto;
      }

      .input-group label {
        display: block;
        color: #88ccc4;
        font-weight: bold;
        margin-bottom: 5px;
      }

      input[type="text"], input[type="number"], select {
        padding: 12px;
        font-size: 16px;
        border-radius: 10px;
        border: 2px solid #ddd;
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        outline: none;
        background-color: #fff;
      }

      input:focus, select:focus {
        border-color: #ff8c42;
      }

      .start-btn {
        background: #ff8c42;
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 20px;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 4px 0 #e07b3a;
        margin-top: 10px;
      }

      .start-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #e07b3a;
      }

      .hidden { display: none !important; }

      .submit-btn {
        background: #88ccc4;
        color: white;
        border: none;
        padding: 8px 20px;
        font-size: 15px;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 3px 0 #6ab5ad;
        margin-top: 8px;
        font-family: inherit;
      }

      .submit-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #6ab5ad;
      }
    </style>
  </head>
  <body>

    <div class="header-area" id="header-area">
      <h1>國語成語大挑戰</h1>
      <div class="score-board">得分：<span id="score">0</span> / 100</div>
      <div id="nav-container" class="hidden"></div>
      <div id="submit-area" class="hidden" style="margin-top:8px;">
        <button class="submit-btn" onclick="confirmSubmit()">📝 交卷</button>
      </div>
    </div>

    <div id="login-card" class="card">
      <h2 style="color:#ff8c42;">📝 學生資料登入</h2>

      <div class="input-group">
        <label>班級</label>
        <select id="input-class" onchange="checkClassData()">
          <option value="" disabled selected>請選擇班級</option>
          <option value="301">301</option>
          <option value="302">302</option>
          <option value="303">303</option>
          <option value="304">304</option>
        </select>
      </div>

      <div class="input-group">
        <label>座號</label>
        <select id="input-seat">
          <option value="" disabled selected>請選擇座號</option>
        </select>
      </div>

      <div class="input-group" id="name-container">
        <label>姓名</label>
        <input type="text" id="input-name" placeholder="請先選擇班級">
      </div>

      <div>
        <button class="start-btn" onclick="startGame()">開始測驗</button>
      </div>
    </div>

    <div id="quiz-card" class="card hidden">
      <div id="welcome-msg" class="hidden">
        ☝️ 點擊上方號碼開始作答！
      </div>

      <div id="question-area" class="hidden">
        <div id="question-text"></div>
        <div class="options-grid" id="options-area"></div>
      </div>
    </div>

    <div id="result-card" class="card hidden">
      <h2 style="color:#ff8c42; font-size: 28px;">測驗結束！</h2>
      <p style="font-size: 20px;">你的總分是：</p>
      <div style="font-size: 60px; color: #88ccc4; font-weight:bold; margin: 10px 0;">
        <span id="final-score">0</span>
      </div>
      <div id="upload-status" style="color:#999; margin-top:20px;">
        正在儲存成績...
      </div>
    </div>

    <script>
      // ===== 題庫 =====
      const sourceData = [
        // 第一課
        ["事與願違", "事實和願望相違背。", "我們原本想去野餐，但____，出門前突然下起大雨。"],
        ["暮鼓晨鐘", "比喻使人警醒的力量。", "爺爺的一番話語有如____，使我大澈大悟。"],
        ["揠苗助長", "比喻使用不當的手段以求速成，結果不但無益，反而有害。", "你一下子給花施這麼多肥，小心____，造成反效果。"],
        ["開誠布公", "比喻誠意待人，坦白無私。", "班長希望大家____的談一談，以化解彼此的誤會。"],
        ["焦頭爛額", "比喻做事陷入十分狼狽窘迫的困境或犧牲慘重。", "他最近為了畫展的事，忙得____，連吃飯的時間都沒有。"],
        ["防微杜漸", "在錯誤或壞事萌芽的時候及時制止，杜絕它發展。", "小疏忽往往釀成大禍，我們應該____，避免日後衍生大問題。"],
        // 第二課
        ["披星戴月", "形容早出晚歸、連夜趕路或工作備極勞累。", "爸爸為了家人，每天____的工作，好讓我們衣食無缺。"],
        ["順水推舟", "比喻順應情勢行事。", "他的實力本就不差，我只不過____拉他一把，讓他有表現的機會。"],
        ["功敗垂成", "指事情在即將成功時卻失敗了。", "做任何事情若不能堅持到底，就會____。"],
        ["世態炎涼", "比喻世俗情態反覆無常。", "他在得意時受人景仰，失意時被大家唾棄，這正是____的最好寫照。"],
        ["津津有味", "形容興味濃厚的樣子，或形容食欲很好。", "這本小說內容曲折離奇，讓人讀後覺得____。"],
        ["價值連城", "形容物品十分珍貴。", "這幅水墨畫____，是國寶級的寶物。"],
        // 第三課
        ["千鈞一髮", "比喻情況非常危險、危急。", "比賽到了____的時刻，隊長的一記三分球，使我隊終場以一分險勝。"],
        ["拾人牙慧", "比喻蹈襲他人的言論或主張。", "這篇論文毫無見地，不過是____而已。"],
        ["麻木不仁", "比喻對事物漠不關心或反應遲鈍。", "災區死傷那麼嚴重，還是有些人____，不聞不問。"],
        ["風馳電掣", "形容速度極快。", "一接到通報，消防車立即____的趕到失火地點。"],
        ["不學無術", "指人未經學習而沒有學問才幹。", "他的心地雖然不壞，卻因____而無法獲得大家的認同。"],
        ["推波助瀾", "比喻從旁鼓動，使事態擴大。", "本來只是件小事，卻因有人從中____，結果弄得雙方針鋒相對。"],
        // 第四課
        ["數典忘祖", "比喻人忘本。", "你只知西洋的鋼琴，而不曉得國樂的胡琴，真有點____了！"],
        ["惱羞成怒", "因羞愧到極點而惱恨發怒。", "面對大家的不斷指責，他____，發了脾氣。"],
        ["老嫗能解", "形容文字通俗明白，淺顯易懂。", "這位作家的作品平易近人，____，因此深受讀者歡迎。"],
        ["班門弄斧", "比喻在行家面前賣弄本事，不自量力。", "今天我竟然在專家面前大談西洋美術史，真是____。"],
        ["循循善誘", "形容善於循序漸進的誘導別人。", "在老師的____之下，他的成績有了很大的進步。"],
        ["咫尺天涯", "比喻相距雖近，卻如同相隔千里，不能相見。", "人若有緣，天涯咫尺；人若無緣，____。"],
        // 第五課
        ["門庭若市", "比喻上門來的人很多。", "這家餐廳物美價廉，因此每到用餐時間總是____。"],
        ["猶豫不決", "遲疑不定，無法拿定主意。", "他對出國留學這件事情____，遲遲無法決定。"],
        ["千篇一律", "形容事物的形式呆板而毫無變化。", "外面賣的便當，幾乎天天都是那幾樣菜，____，吃都吃膩了。"],
        ["改過自新", "改正過失，重新做人。", "雖然他犯了過錯，但只要他能____，大家就原諒他。"],
        ["設身處地", "假想自己處在他人地位或情況中。", "他凡事能____為別人著想，所以很受歡迎。"],
        ["付之一炬", "指物品、成果全數被焚燬。", "他的財產在這場火災中全部____。"],
        // 第六課
        ["有目共睹", "指事實極為明顯，眾所周知。", "他在古典樂的貢獻，世人____，如今獲頒獎項真是實至名歸。"],
        ["鵬程萬里", "比喻前程遠大，不可限量。", "校長在畢業典禮上，祝福畢業生____，一帆風順。"],
        ["張口結舌", "形容恐懼慌張，或理屈說不出話的樣子。", "他在眾人的追問下，一時之間____，什麼話也說不出來。"],
        ["立竿見影", "比喻迅速收到成效。", "新的交通法規才剛實施，就收到____的成效。"],
        ["包羅萬象", "形容內容豐富，應有盡有。", "大賣場的商品____，幾乎你想得到的東西都可以找到。"],
        ["觸類旁通", "根據對已知事物的認識，進而通達對其他類似事物的認知。", "老師不厭其煩的講解例題，就是要我們能____，舉一反三。"]
      ];

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function getQuizData() {
        const allIdioms = sourceData.map(item => item[0]);
        const selectedData = shuffle([...sourceData]).slice(0, 20);
        return selectedData.map((item, index) => {
          const idiom = item[0];
          const definition = item[1];
          const example = item[2];
          const isDefinitionQuestion = Math.random() > 0.5;
          const questionText = isDefinitionQuestion
            ? `成語含義：「${definition}」是指哪個成語？`
            : `請填入正確成語：${example}`;
          const otherOptions = allIdioms.filter(opt => opt !== idiom);
          const distractors = shuffle(otherOptions).slice(0, 3);
          const options = shuffle([idiom, ...distractors]);
          return { id: index + 1, question: questionText, options, answer: idiom };
        });
      }

      const names302 = [
        "李文澯", "湯宸羽", "陳品言", "邱宇睿", "李旻翰", "張宸嘉",
        "林郡騏", "陳謙益", "胡証翔", "王家安", "梁雨禾", "吳予馨",
        "江曼瑜", "劉安喬", "李芸儀", "楊侑曈", "徐子涵", "林妍希"
      ];

      let quizData = [];
      let currentScore = 0;
      let answeredStatus = {};
      let currentQuestionId = null;
      let userClass = "", userSeat = "", userName = "";

      window.onload = function() {
        initSeatOptions();
        quizData = getQuizData();
      };

      function initSeatOptions() {
        const seatSelect = document.getElementById('input-seat');
        for (let i = 1; i <= 20; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.innerText = i + " 號";
          seatSelect.appendChild(opt);
        }
      }

      function checkClassData() {
        const classVal = document.getElementById('input-class').value;
        const nameContainer = document.getElementById('name-container');
        if (classVal === '302') {
          let html = '<label>姓名</label><select id="input-name"><option value="" disabled selected>請選擇姓名</option>';
          names302.forEach(name => { html += `<option value="${name}">${name}</option>`; });
          html += '</select>';
          nameContainer.innerHTML = html;
        } else {
          nameContainer.innerHTML = `<label>姓名</label><input type="text" id="input-name" placeholder="請輸入姓名">`;
        }
      }

      function startGame() {
        const classInput = document.getElementById('input-class');
        const seatInput = document.getElementById('input-seat');
        const nameInput = document.getElementById('input-name');
        if (!classInput.value || !seatInput.value || !nameInput.value || nameInput.value.trim() === "") {
          alert("請將班級、座號、姓名都填寫完整喔！");
          return;
        }
        userClass = classInput.value;
        userSeat = seatInput.value;
        userName = nameInput.value.trim();
        document.getElementById('login-card').classList.add('hidden');
        document.getElementById('quiz-card').classList.remove('hidden');
        document.getElementById('nav-container').classList.remove('hidden');
        renderNav();
        document.getElementById('welcome-msg').classList.remove('hidden');
        document.getElementById('submit-area').classList.remove('hidden');
      }

      function confirmSubmit() {
        const answered = Object.keys(answeredStatus).length;
        const unanswered = 20 - answered;
        const msg = unanswered > 0
          ? `還有 ${unanswered} 題尚未作答，確定要交卷嗎？`
          : '所有題目都已作答，確定要交卷嗎？';
        if (confirm(msg)) showFinalResult();
      }

      function renderNav() {
        const container = document.getElementById('nav-container');
        container.innerHTML = '';
        quizData.forEach((item, index) => {
          const btn = document.createElement('div');
          btn.className = 'nav-btn';
          btn.innerText = index + 1;
          btn.id = 'nav-' + index;
          if (answeredStatus[index] === 'correct') btn.classList.add('correct');
          if (answeredStatus[index] === 'wrong') btn.classList.add('wrong');
          btn.onclick = () => openQuestion(index);
          container.appendChild(btn);
        });
      }

      function openQuestion(index) {
        currentQuestionId = index;
        const questionData = quizData[index];
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('nav-' + index).classList.add('active');
        document.getElementById('welcome-msg').classList.add('hidden');
        document.getElementById('question-area').classList.remove('hidden');
        document.getElementById('question-text').innerText = questionData.question;
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = '';
        if (answeredStatus[index]) {
          const msgDiv = document.createElement('div');
          msgDiv.innerHTML = answeredStatus[index] === 'correct'
            ? "<span style='color:#6bd1ac; font-size:20px'>✅ 答對了！</span>"
            : "<span style='color:#ff8b94; font-size:20px'>❎ 正確答案：" + questionData.answer + "</span>";
          optionsArea.appendChild(msgDiv);
          return;
        }
        questionData.options.forEach(option => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = option;
          btn.onclick = () => checkAnswer(btn, option, questionData.answer);
          optionsArea.appendChild(btn);
        });
      }

      function checkAnswer(btnElement, selectedOption, correctOption) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);
        const navBtn = document.getElementById('nav-' + currentQuestionId);
        if (selectedOption === correctOption) {
          btnElement.style.backgroundColor = '#a8e6cf';
          btnElement.style.borderColor = '#6bd1ac';
          currentScore += 5;
          document.getElementById('score').innerText = currentScore;
          answeredStatus[currentQuestionId] = 'correct';
          navBtn.classList.add('correct');
          setTimeout(() => jumpToNextUnanswered(), 1000);
        } else {
          btnElement.style.backgroundColor = '#ffaaa5';
          btnElement.style.borderColor = '#ff8b94';
          answeredStatus[currentQuestionId] = 'wrong';
          navBtn.classList.add('wrong');
          allBtns.forEach(b => {
            if (b.innerText === correctOption) b.style.backgroundColor = '#a8e6cf';
          });
          setTimeout(() => jumpToNextUnanswered(), 2000);
        }
      }

      function jumpToNextUnanswered() {
        let nextId = -1;
        for (let i = currentQuestionId + 1; i < 20; i++) {
          if (!answeredStatus[i]) { nextId = i; break; }
        }
        if (nextId === -1) {
          for (let i = 0; i < currentQuestionId; i++) {
            if (!answeredStatus[i]) { nextId = i; break; }
          }
        }
        if (nextId !== -1) {
          openQuestion(nextId);
        } else {
          showFinalResult();
        }
      }

      function showFinalResult() {
        document.getElementById('quiz-card').classList.add('hidden');
        document.querySelector('.header-area').classList.add('hidden');
        document.getElementById('result-card').classList.remove('hidden');
        document.getElementById('final-score').innerText = currentScore;

        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const timeString = `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

        const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLScLD8M4t4JykfirzgFfEdG97MgAuGN31Co2Ja98FRpjinf0fg/formResponse';
        const params = new URLSearchParams();
        params.append('entry.1766577672', timeString);
        params.append('entry.651724226', userClass);
        params.append('entry.2093066727', userSeat);
        params.append('entry.851725006', userName);
        params.append('entry.1360919938', String(currentScore));

        fetch(formUrl, { method: 'POST', mode: 'no-cors', body: params })
          .then(() => {
            document.getElementById('upload-status').innerText = "✅ 成績已成功儲存！";
            document.getElementById('upload-status').style.color = "#6bd1ac";
          })
          .catch(() => {
            document.getElementById('upload-status').innerText = "❌ 儲存失敗，請截圖給老師。";
            document.getElementById('upload-status').style.color = "red";
          });
      }
    </script>
  </body>
</html>
